name: Build Plugin ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 0.3.0)'
        required: false
        type: string

# All run steps execute from the plugin directory
defaults:
  run:
    working-directory: bvi-mega-menu

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      - name: Build assets
        run: npm run build || true
        continue-on-error: true

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create plugin ZIP
        run: |
          PLUGIN_SLUG="bvi-mega-menu"
          BUILD_DIR="/tmp/${PLUGIN_SLUG}"

          mkdir -p "${BUILD_DIR}"

          # Copy plugin files (exclude dev/build files)
          rsync -av --exclude-from=- . "${BUILD_DIR}/" <<'EOF'
          .git
          .github
          .phpunit.cache
          node_modules
          tests
          phpunit.xml
          .gitignore
          .editorconfig
          .phpcs.xml
          gulpfile.mjs
          package.json
          package-lock.json
          composer.lock
          *.md
          !readme.txt
          EOF

          cd /tmp
          zip -r "${GITHUB_WORKSPACE}/${PLUGIN_SLUG}-${{ steps.version.outputs.tag }}.zip" "${PLUGIN_SLUG}/"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: bvi-mega-menu-${{ steps.version.outputs.tag }}
          path: bvi-mega-menu-*.zip
          retention-days: 90

      - name: Attach ZIP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: bvi-mega-menu-*.zip
